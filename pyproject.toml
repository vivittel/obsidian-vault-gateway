[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-vault-gateway"
version = "0.1.0"
description = "Secure REST gateway for controlled access to an Obsidian Vault"
readme = "README.md"
requires-python = ">=3.12"

# Pinned exactly (see docs/IMPLEMENTATION_PLAN.md section 18: "依存関係を固定する").
# requirements.lock holds the fully resolved transitive set used by the Docker image.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.16.1",
]

[tool.setuptools]
packages = ["app", "app.routers", "app.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# S (flake8-bandit) is deliberately enabled: this service's whole purpose is
# constrained filesystem access. PTH is deliberately *not* enabled because the
# path-security and atomic-write code uses os-level syscalls (os.open, os.link,
# os.walk, os.lstat) on purpose rather than the higher-level pathlib helpers.
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET", "S", "N", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # assert is the point of a test
    "S105", # hardcoded test tokens
    "S106",
    "S108", # /vault-ro style literals in assertions
    "ARG001", # pytest fixtures are often depended on only for their side effects
    "S603", # subprocess calls in tests use sys.executable + a fixed repo-relative path
]
"scripts/*" = ["S101"]
