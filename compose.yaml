services:
  obsidian-api:
    image: ${OBSIDIAN_GATEWAY_IMAGE:-ghcr.io/vivittel/obsidian-vault-gateway:latest}
    container_name: obsidian-api
    restart: unless-stopped

    environment:
      TZ: ${TZ:-Asia/Tokyo}
      API_TOKEN: ${API_TOKEN}
      # Keep true unless an equivalent access-control boundary already exists
      # outside this container. See .env.example.
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      # Streamable HTTP DNS-rebinding allowlist (U2) — must include whatever
      # Host header Caddy forwards, e.g. obsidian-api.example.com. See
      # .env.example.
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS}
      VAULT_READ_ROOT: ${VAULT_READ_ROOT:-/vault-ro}
      VAULT_INBOX_ROOT: ${VAULT_INBOX_ROOT:-/vault-write/inbox}
      VAULT_INBOX_RELATIVE_PATH: ${VAULT_INBOX_RELATIVE_PATH:-00_Inbox/ChatGPT}
      MAX_SEARCH_RESULTS: ${MAX_SEARCH_RESULTS:-50}
      MAX_NOTE_SIZE_BYTES: ${MAX_NOTE_SIZE_BYTES:-1048576}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-2097152}
      # Applied to the obsidian_gateway loggers by app/logging_config.py. DEBUG
      # additionally surfaces the /api/v1/health line the Docker HEALTHCHECK
      # produces every 30s, which is deliberately below INFO.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    # The application only ever writes to stdout (the container filesystem is
    # read_only below), so Docker's driver is the whole retention story. Without
    # these options json-file keeps every line forever and fills the OMV disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      # Whole vault, read-only. VAULT_HOST_PATH comes from .env — see
      # .env.example for how to find the real OMV path.
      - ${VAULT_HOST_PATH}:/vault-ro:ro
      # Only 00_Inbox/ChatGPT, read-write. This is the one writable directory
      # (AGENTS.md security invariant) — INBOX_HOST_PATH must point inside
      # VAULT_HOST_PATH at the same subdirectory VAULT_INBOX_RELATIVE_PATH names.
      - ${INBOX_HOST_PATH}:/vault-write/inbox:rw

    networks:
      - proxy

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    # A last line of defence, not a substitute for the app-level bounds
    # (frontmatter conversion budget, per-request size caps) that keep
    # normal operation far under this. See README's "Container memory
    # limit" section for the measurement behind this value.
    mem_limit: 512m

    tmpfs:
      - /tmp:size=64m

networks:
  # Local alias kept stable regardless of what the real external network is
  # actually called on the host — IMPLEMENTATION_PLAN.md section 15 and this
  # file's own history disagreed (br0 vs caddy); PROXY_NETWORK settles that by
  # making the real name a deployment choice instead of a hardcoded guess.
  # Defaults to "caddy", this file's actual name before this change.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-caddy}
